<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Primary 24K Luxury Metallic Gold Gradient -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7C2" />
      <stop offset="25%" stop-color="#F7C95F" />
      <stop offset="52%" stop-color="#D48E1F" />
      <stop offset="78%" stop-color="#FFE28A" />
      <stop offset="100%" stop-color="#9A5C06" />
    </linearGradient>

    <!-- Facet Dark Gold for 3D Bevelled Compass Points -->
    <linearGradient id="goldDarkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C47D16" />
      <stop offset="50%" stop-color="#8A5004" />
      <stop offset="100%" stop-color="#4A2901" />
    </linearGradient>

    <!-- Bright Specular Gold Facet -->
    <linearGradient id="goldBrightFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6A43B" />
      <stop offset="55%" stop-color="#FFF0A8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Obsidian Core -->
    <radialGradient id="obsidianCore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#17130A" />
      <stop offset="60%" stop-color="#090806" />
      <stop offset="100%" stop-color="#030304" />
    </radialGradient>

    <!-- Ambient Warm Gold Halo -->
    <radialGradient id="goldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B027" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#D97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="luxuryShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="120" cy="120" r="115" fill="url(#goldHalo)" />

  <!-- Outer Royal Gold Medallion Ring -->
  <circle
    cx="120"
    cy="120"
    r="105"
    fill="url(#obsidianCore)"
    stroke="url(#goldPrimary)"
    stroke-width="4"
    filter="url(#luxuryShadow)"
  />

  <!-- Inner Precision Degree Ring -->
  <circle
    cx="120"
    cy="120"
    r="94"
    stroke="url(#goldPrimary)"
    stroke-width="1.2"
    stroke-dasharray="3 4.5"
    opacity="0.8"
  />
  <circle
    cx="120"
    cy="120"
    r="86"
    stroke="url(#goldPrimary)"
    stroke-width="1.8"
    opacity="0.92"
  />

  <!-- ===================================================================== -->
  <!-- LUXURY GLOBE MERIDIANS & SCENIC HORIZON ARCS                          -->
  <!-- ===================================================================== -->
  <g stroke="url(#goldPrimary)" opacity="0.45" fill="none">
    <!-- Latitude Arcs -->
    <path d="M42 92 Q120 112 198 92" stroke-width="1.3" />
    <path d="M42 148 Q120 128 198 148" stroke-width="1.3" />
    <!-- Longitude Ellipses -->
    <ellipse cx="120" cy="120" rx="46" ry="85" stroke-width="1.3" />
    <ellipse cx="120" cy="120" rx="72" ry="85" stroke-width="1" opacity="0.65" />
  </g>

  <!-- Sweeping Luxury Travel Flight / Road Orbit Swoosh -->
  <path
    d="M32 146 C68 182, 162 174, 208 94"
    stroke="url(#goldBrightFacet)"
    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
    filter="url(#luxuryShadow)"
  />
  <path
    d="M38 154 C76 186, 158 180, 202 108"
    stroke="url(#goldPrimary)"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"
    opacity="0.75"
  />

  <!-- ===================================================================== -->
  <!-- 3D BEVELLED 8-POINTED ROYAL COMPASS ROSE (Icon of Luxury Travel)      -->
  <!-- ===================================================================== -->
  <!-- Diagonal Secondary Points (NW, NE, SE, SW) -->
  <g filter="url(#luxuryShadow)">
    <!-- NE Point -->
    <polygon points="120,120 134,120 174,66" fill="url(#goldBrightFacet)" />
    <polygon points="120,120 120,106 174,66" fill="url(#goldDarkFacet)" />
    <!-- SE Point -->
    <polygon points="120,120 120,134 174,174" fill="url(#goldBrightFacet)" />
    <polygon points="120,120 134,120 174,174" fill="url(#goldDarkFacet)" />
    <!-- SW Point -->
    <polygon points="120,120 106,120 66,174" fill="url(#goldBrightFacet)" />
    <polygon points="120,120 120,134 66,174" fill="url(#goldDarkFacet)" />
    <!-- NW Point -->
    <polygon points="120,120 120,106 66,66" fill="url(#goldBrightFacet)" />
    <polygon points="120,120 106,120 66,66" fill="url(#goldDarkFacet)" />
  </g>

  <!-- Primary Cardinal Points (N, E, S, W) — Bold & Crisp at Any Size -->
  <g filter="url(#luxuryShadow)">
    <!-- NORTH Point -->
    <polygon points="120,18 120,120 101,101" fill="url(#goldBrightFacet)" />
    <polygon points="120,18 139,101 120,120" fill="url(#goldDarkFacet)" />

    <!-- SOUTH Point -->
    <polygon points="120,222 139,139 120,120" fill="url(#goldBrightFacet)" />
    <polygon points="120,222 120,120 101,139" fill="url(#goldDarkFacet)" />

    <!-- EAST Point -->
    <polygon points="222,120 120,120 139,101" fill="url(#goldBrightFacet)" />
    <polygon points="222,120 139,139 120,120" fill="url(#goldDarkFacet)" />

    <!-- WEST Point -->
    <polygon points="18,120 101,139 120,120" fill="url(#goldBrightFacet)" />
    <polygon points="18,120 120,120 101,101" fill="url(#goldDarkFacet)" />
  </g>

  <!-- Center Jewel Hub -->
  <circle cx="120" cy="120" r="14" fill="#070708" stroke="url(#goldPrimary)" stroke-width="2.8" />
  <circle cx="120" cy="120" r="6" fill="url(#goldBrightFacet)" />
</svg>
