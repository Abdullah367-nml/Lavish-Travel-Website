<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Vibrant African Setting Sun Gradient (Golden Yellow to Sunset Orange) -->
    <linearGradient id="africanSun" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="78%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Warm Savanna Sunset Sky Backdrop -->
    <linearGradient id="savannaSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2D1206" />
      <stop offset="35%" stop-color="#7C2D12" />
      <stop offset="72%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- 24K Gold & Sunset Rim Bezel -->
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1" />
      <stop offset="30%" stop-color="#F5B027" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#8C4303" />
    </linearGradient>

    <!-- Mount Kilimanjaro Earthy Bronze & Sunset Slope -->
    <linearGradient id="kilimanjaroSlope" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#854D27" />
      <stop offset="55%" stop-color="#542D14" />
      <stop offset="100%" stop-color="#361A09" />
    </linearGradient>

    <!-- Golden Savanna Mist at Base of Kilimanjaro (Separates Wildlife from Mountain) -->
    <linearGradient id="savannaMist" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0" />
      <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Lush Safari Emerald Green Savanna Hills -->
    <linearGradient id="safariGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#228B46" />
      <stop offset="55%" stop-color="#145A2D" />
      <stop offset="100%" stop-color="#093016" />
    </linearGradient>

    <!-- Victoria Falls Cascading Water & Golden Spray -->
    <linearGradient id="victoriaFalls" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="45%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <clipPath id="medallionClip">
      <circle cx="120" cy="120" r="98" />
    </clipPath>

    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Outer Luxury Medallion Frame -->
  <circle
    cx="120"
    cy="120"
    r="108"
    fill="#120904"
    stroke="url(#goldBezel)"
    stroke-width="4.5"
    filter="url(#softShadow)"
  />
  <circle
    cx="120"
    cy="120"
    r="101"
    stroke="#FDE047"
    stroke-width="1"
    stroke-dasharray="4 3"
    opacity="0.65"
  />

  <!-- ===================================================================== -->
  <!-- INNER AFRICAN SAFARI, KILIMANJARO, WILDLIFE & VICTORIA FALLS SCENE    -->
  <!-- ===================================================================== -->
  <g clip-path="url(#medallionClip)">
    <!-- 1. Warm African Sunset Sky -->
    <rect x="20" y="20" width="200" height="160" fill="url(#savannaSky)" />

    <!-- 2. Giant Glowing African Setting Sun -->
    <circle cx="122" cy="96" r="59" fill="url(#africanSun)" />
    <circle cx="122" cy="96" r="67" stroke="#FDE047" stroke-width="1.1" opacity="0.35" />

    <!-- 3. Iconic Mount Kilimanjaro on the Center Horizon (with Snow-Capped Kibo Peak) -->
    <path
      d="M36 138
         L68 110
         L90 82
         L102 74
         L128 74
         L142 82
         L172 112
         L204 138
         Z"
      fill="url(#kilimanjaroSlope)"
      stroke="#FBBF24"
      stroke-width="0.9"
    />
    <!-- Kilimanjaro Golden Snow Crown & Glacier Ridges -->
    <path
      d="M102 74
         L128 74
         L138 80
         L129 85
         L122 81
         L114 86
         L106 81
         L94 84
         Z"
      fill="#FFFBEB"
    />

    <!-- Warm Golden Savanna Horizon Glow (Makes Wildlife Silhouettes Pop!) -->
    <rect x="20" y="96" width="200" height="44" fill="url(#savannaMist)" />

    <!-- 4. Savanna Acacia Tree Silhouette (Left Horizon) -->
    <g fill="#1C0A02">
      <path
        d="M55 140 L57 118 L45 109 L47 108 L58 115 L61 107 L63 107 L60 115 L71 110 L72 111 L59 118 L61 140 Z"
      />
      <ellipse cx="46" cy="108" rx="14" ry="3.2" />
      <ellipse cx="62" cy="106" rx="16" ry="3.5" />
      <ellipse cx="72" cy="110" rx="11" ry="2.8" />
    </g>

    <!-- 5. Iconic African Wildlife Silhouettes (Giraffe & Majestic Elephant) -->
    <!-- Tall Graceful Giraffe (Left-Center) -->
    <path
      d="M84 140
         L85 123
         L79 124
         L77 140
         L74.5 140
         L76 121
         C76 117, 79 114, 83 113
         L93 89
         L91 88
         L94 86
         L97 87
         L96 89
         L89 113
         C92 115, 93 118, 92 123
         L93 140
         L90.5 140
         L89.5 125
         L86 124
         L86 140
         Z"
      fill="#1A0902"
    />

    <!-- Majestic African Bull Elephant with Raised Trunk & Tusks (Right-Center) -->
    <g fill="#1A0902">
      <path
        d="M126 140
           L127 123
           C125 115, 128 106, 138 104
           C146 102, 155 103, 160 107
           C164 104, 169 105, 172 109
           C175 112, 178 109, 180 102
           C181 99, 183 99, 183 103
           C182 111, 178 116, 173 117
           L172 140
           L166 140
           L166 125
           L159 125
           L158 140
           L152 140
           L152 124
           L140 124
           L139 140
           L133 140
           L133 125
           L130 125
           L130 140
           Z"
      />
      <!-- Bright Ivory Tusk Highlight -->
      <path
        d="M171 115 Q179 116 183 111 Q178 119 170 118 Z"
        fill="#FFFBEB"
      />
    </g>

    <!-- Soaring African Birds in Sunset Sky -->
    <path
      d="M148 64 Q153 60 157 64 Q161 60 166 64 Q161 62 157 66 Q153 62 148 64 Z"
      fill="#2D1206"
    />
    <path
      d="M166 55 Q169 52 172 55 Q175 52 178 55 Q175 54 172 56.5 Q169 54 166 55 Z"
      fill="#2D1206"
    />

    <!-- 6. Lush Safari Green Savanna Terraces (Left & Right Banks) -->
    <path
      d="M20 135 Q68 131 98 138 L86 176 L20 176 Z"
      fill="url(#safariGreen)"
      stroke="#F5B027"
      stroke-width="1.2"
    />
    <path
      d="M220 135 Q172 131 142 138 L154 176 L220 176 Z"
      fill="url(#safariGreen)"
      stroke="#F5B027"
      stroke-width="1.2"
    />

    <!-- 7. Iconic Victoria Falls Cascading Gorge (Center Foreground) -->
    <path
      d="M96 137
         L144 137
         L156 176
         L84 176
         Z"
      fill="#083344"
      stroke="#F5B027"
      stroke-width="1"
    />
    <!-- Cascading Waterfall Streams -->
    <path
      d="M102 138 L94 174
         M110 138 L105 174
         M118 138 L116 174
         M124 138 L126 174
         M131 138 L136 174
         M139 138 L146 174"
      stroke="url(#victoriaFalls)"
      stroke-width="2.6"
      stroke-linecap="round"
    />
    <!-- Rising Mist Spray at the Base of Victoria Falls -->
    <path
      d="M74 173 Q98 166 120 171 T166 173"
      stroke="#FFFBEB"
      stroke-width="2.2"
      stroke-linecap="round"
      fill="none"
      opacity="0.92"
    />

    <!-- 8. Lower Earthy Brown & Gold Brand Banner Inside the Crest -->
    <rect x="20" y="175" width="200" height="48" fill="#180B04" />
    <line x1="26" y1="175" x2="214" y2="175" stroke="url(#goldBezel)" stroke-width="2" />

    <!-- Website Brand Name Inside the Crest -->
    <text
      x="120"
      y="194"
      text-anchor="middle"
      fill="url(#goldBezel)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      font-weight="900"
      letter-spacing="4.5"
    >
      LAVISH
    </text>
    <text
      x="120"
      y="206"
      text-anchor="middle"
      fill="#FDBA74"
      font-family="Arial, Helvetica, sans-serif"
      font-size="6.2"
      font-weight="800"
      letter-spacing="2.4"
    >
      TRAVELS &amp; TOURS
    </text>
  </g>
</svg>
