<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- 24K Luxury Metallic Gold Gradient -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="22%" stop-color="#F6C85F" />
      <stop offset="48%" stop-color="#D49122" />
      <stop offset="75%" stop-color="#FFE08A" />
      <stop offset="100%" stop-color="#9A5E08" />
    </linearGradient>

    <!-- Bright Gold Highlight for Springbok Body -->
    <linearGradient id="springbokGold" x1="10%" y1="0%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF8C9" />
      <stop offset="35%" stop-color="#F7CA5E" />
      <stop offset="70%" stop-color="#DF9B28" />
      <stop offset="100%" stop-color="#A66509" />
    </linearGradient>

    <!-- Metallic Gold Rim Sheen -->
    <linearGradient id="goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B06E0E" />
      <stop offset="50%" stop-color="#FFE699" />
      <stop offset="100%" stop-color="#874D02" />
    </linearGradient>

    <!-- Obsidian & Subtle South African Springbok Heritage Green Core -->
    <radialGradient id="shieldCore" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0B291E" />
      <stop offset="55%" stop-color="#071510" />
      <stop offset="100%" stop-color="#040506" />
    </radialGradient>

    <!-- Rugby Ball Rich Dark Leather & Gold Tint -->
    <linearGradient id="rugbyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D140B" />
      <stop offset="50%" stop-color="#0D1F17" />
      <stop offset="100%" stop-color="#060807" />
    </linearGradient>

    <!-- Ambient Warm Gold Halo -->
    <radialGradient id="regalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B027" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Outer Ambient Gold Halo -->
  <circle cx="120" cy="120" r="114" fill="url(#regalGlow)" />

  <!-- Outer Luxury Medallion Ring -->
  <circle cx="120" cy="120" r="106" fill="#050506" stroke="url(#richGold)" stroke-width="3" filter="url(#dropShadow)" />
  <circle cx="120" cy="120" r="99" stroke="url(#goldSheen)" stroke-width="1" stroke-dasharray="4 3" opacity="0.85" />

  <!-- Inner Shield Circle with Dark Obsidian-Bok Green Depth -->
  <circle cx="120" cy="120" r="92" fill="url(#shieldCore)" stroke="url(#richGold)" stroke-width="2" />

  <!-- Subtle Rising Sun Rays over Table Mountain -->
  <g opacity="0.28" stroke="url(#richGold)" stroke-width="1">
    <line x1="120" y1="54" x2="120" y2="36" />
    <line x1="138" y1="58" x2="150" y2="43" />
    <line x1="102" y1="58" x2="90" y2="43" />
    <line x1="154" y1="68" x2="170" y2="58" />
    <line x1="86" y1="68" x2="70" y2="58" />
  </g>

  <!-- Rising African Sun Arc -->
  <path d="M92 84 A28 28 0 0 1 148 84 Z" fill="url(#richGold)" opacity="0.32" />

  <!-- Iconic Flat-Topped Table Mountain Horizon Silhouette -->
  <path
    d="M46 92 L66 86 L82 76 L158 76 L174 86 L194 92 L194 97 L46 97 Z"
    fill="#060908"
    stroke="url(#goldSheen)"
    stroke-width="1.3"
    stroke-linejoin="round"
  />

  <!-- ===================================================================== -->
  <!-- RUGBY BALL EMBLEM (Tilted Dynamic Prolate Ellipsoid with Gold Seams)   -->
  <!-- ===================================================================== -->
  <g transform="translate(120, 134) rotate(-18)" filter="url(#dropShadow)">
    <!-- Outer Rugby Ball Silhouette -->
    <path
      d="M-54 0 C-38 -27, 38 -27, 54 0 C38 27, -38 27, -54 0 Z"
      fill="url(#rugbyFill)"
      stroke="url(#richGold)"
      stroke-width="2.4"
    />
    <!-- Top & Bottom Curved Rugby Panel Seams -->
    <path
      d="M-48 -3 C-24 -16, 24 -16, 48 -3"
      stroke="url(#goldSheen)"
      stroke-width="1.4"
      fill="none"
    />
    <path
      d="M-48 3 C-24 16, 24 16, 48 3"
      stroke="url(#goldSheen)"
      stroke-width="1.4"
      fill="none"
    />
    <!-- Center Seam & Traditional Rugby Lacing -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke="url(#richGold)" stroke-width="1.2" opacity="0.9" />
    <line x1="-16" y1="-4.5" x2="-16" y2="4.5" stroke="#FFF5B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-8" y1="-5" x2="-8" y2="5" stroke="#FFF5B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="0" y1="-5.2" x2="0" y2="5.2" stroke="#FFF5B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="-5" x2="8" y2="5" stroke="#FFF5B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="-4.5" x2="16" y2="4.5" stroke="#FFF5B8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ===================================================================== -->
  <!-- ICONIC LEAPING SOUTH AFRICAN SPRINGBOK (24K Gold Dynamic Silhouette)  -->
  <!-- ===================================================================== -->
  <g filter="url(#dropShadow)">
    <!-- Sweeping Speed Arc Beneath the Leap -->
    <path
      d="M42 152 Q112 108 194 128"
      stroke="url(#richGold)"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
      opacity="0.75"
    />

    <!-- Signature Curved Black/Gold Springbok Horns (Swept Back) -->
    <path
      d="M164 66 C154 52, 139 48, 128 53 C138 53, 149 58, 157 69 Z"
      fill="url(#richGold)"
    />
    <path
      d="M168 68 C160 56, 147 52, 137 56 C145 56, 155 61, 162 70 Z"
      fill="#FFF5B8"
      opacity="0.9"
    />

    <!-- Pert Ears -->
    <path
      d="M160 70 C154 63, 147 63, 144 67 C149 68, 154 70, 158 73 Z"
      fill="url(#springbokGold)"
    />

    <!-- Main Sculpted Leaping Springbok Body, Head, Tucked Forelegs & Extended Hind Legs -->
    <path
      d="M166 67
         C172 67, 179 71, 184 76
         C186 78, 185 81, 181 82
         C176 83, 170 82, 165 80
         C161 86, 156 95, 151 103
         C160 105, 172 109, 183 116
         C189 120, 193 125, 195 129
         C196 131, 193 133, 190 131
         C184 126, 175 120, 164 116
         C158 114, 151 112, 145 111
         C152 117, 159 124, 162 131
         C163 134, 160 135, 158 133
         C153 127, 146 120, 137 114
         C124 114, 108 116, 94 122
         C81 128, 69 139, 56 152
         C50 158, 44 163, 39 166
         C36 167, 35 164, 38 161
         C45 153, 55 142, 66 131
         C56 136, 46 142, 37 148
         C34 150, 32 147, 35 144
         C46 134, 60 124, 74 115
         C70 112, 66 109, 62 107
         C67 105, 73 106, 78 109
         C92 100, 110 94, 128 93
         C138 92, 146 86, 153 77
         C157 72, 161 68, 166 67 Z"
      fill="url(#springbokGold)"
      stroke="#1A1105"
      stroke-width="0.9"
      stroke-linejoin="round"
    />

    <!-- Characteristic Springbok Flank Stripe & Muscle Contour Highlight -->
    <path
      d="M86 113 C104 104, 124 101, 142 103"
      stroke="#5C3404"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M84 116 C103 107, 123 104, 140 106"
      stroke="#FFF8C9"
      stroke-width="1.3"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Eye Detail -->
    <circle cx="171" cy="74" r="1.4" fill="#0B0906" />
  </g>

  <!-- ===================================================================== -->
  <!-- LOWER CHAMPIONSHIP RIBBON & FIVE HOSPITALITY STARS                    -->
  <!-- ===================================================================== -->
  <path
    d="M68 172 C85 166, 102 163, 120 163 C138 163, 155 166, 172 172 L167 181 C152 176, 136 173, 120 173 C104 173, 88 176, 73 181 Z"
    fill="url(#richGold)"
  />
  <text
    x="120"
    y="170.5"
    text-anchor="middle"
    fill="#050506"
    font-family="sans-serif"
    font-size="6.5"
    font-weight="900"
    letter-spacing="2.2"
  >
    SOUTH AFRICA
  </text>

  <!-- 5 Five-Point Luxury Stars -->
  <g fill="url(#richGold)">
    <polygon points="120,185 122,190 127.5,190 123,193.2 124.8,198.5 120,195.2 115.2,198.5 117,193.2 112.5,190 118,190" />
    <polygon points="103,183 104.6,187 109,187 105.5,189.5 106.8,193.8 103,191.2 99.2,193.8 100.5,189.5 97,187 101.4,187" />
    <polygon points="137,183 138.6,187 143,187 139.5,189.5 140.8,193.8 137,191.2 133.2,193.8 134.5,189.5 131,187 135.4,187" />
    <polygon points="88,179 89.3,182.2 92.8,182.2 90,184.2 91,187.5 88,185.5 85,187.5 86,184.2 83.2,182.2 86.7,182.2" />
    <polygon points="152,179 153.3,182.2 156.8,182.2 154,184.2 155,187.5 152,185.5 149,187.5 150,184.2 147.2,182.2 150.7,182.2" />
  </g>

  <!-- 4 Cardinal Compass Diamonds -->
  <polygon points="120,8 123.5,16 120,24 116.5,16" fill="url(#richGold)" />
  <polygon points="120,232 123.5,224 120,216 116.5,224" fill="url(#richGold)" />
  <polygon points="8,120 16,116.5 24,120 16,123.5" fill="url(#richGold)" />
  <polygon points="232,120 224,116.5 216,120 224,123.5" fill="url(#richGold)" />
</svg>
