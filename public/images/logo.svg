<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- 24K Luxury Gold Gradients -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#F2C054" />
      <stop offset="50%" stop-color="#D49326" />
      <stop offset="75%" stop-color="#F7D373" />
      <stop offset="100%" stop-color="#AA6B0C" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF7D12" />
      <stop offset="50%" stop-color="#FFDE82" />
      <stop offset="100%" stop-color="#8E5202" />
    </linearGradient>

    <radialGradient id="regalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B027" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#E27806" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Obsidian Onyx Backdrop -->
    <radialGradient id="shieldOnyx" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1F1710" />
      <stop offset="70%" stop-color="#0F0C09" />
      <stop offset="100%" stop-color="#050403" />
    </radialGradient>

    <filter id="royalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="100" cy="100" r="94" fill="url(#regalGlow)" />

  <!-- Outer Luxury Astrolabe / Compass Ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#richGold)" stroke-width="1.8" filter="url(#royalShadow)" />
  <circle cx="100" cy="100" r="83" stroke="url(#goldSheen)" stroke-width="0.8" stroke-dasharray="3.5 2.5" opacity="0.85" />

  <!-- 4 Cardinal Compass Diamonds -->
  <polygon points="100,6 103,13 100,20 97,13" fill="url(#richGold)" />
  <polygon points="100,194 103,187 100,180 97,187" fill="url(#richGold)" />
  <polygon points="6,100 13,97 20,100 13,103" fill="url(#richGold)" />
  <polygon points="194,100 187,97 180,100 187,103" fill="url(#richGold)" />

  <!-- 4 Intercardinal Minor Pips -->
  <circle cx="37" cy="37" r="1.8" fill="#F2C054" />
  <circle cx="163" cy="37" r="1.8" fill="#F2C054" />
  <circle cx="37" cy="163" r="1.8" fill="#F2C054" />
  <circle cx="163" cy="163" r="1.8" fill="#F2C054" />

  <!-- Inner Onyx Shield Base -->
  <circle cx="100" cy="100" r="76" fill="url(#shieldOnyx)" stroke="url(#richGold)" stroke-width="1.5" />

  <!-- Cape Town Sunburst Rays behind Table Mountain -->
  <g opacity="0.35" stroke="url(#richGold)" stroke-width="0.75">
    <line x1="100" y1="52" x2="100" y2="40" />
    <line x1="114" y1="55" x2="124" y2="44" />
    <line x1="86" y1="55" x2="76" y2="44" />
    <line x1="124" y1="64" x2="137" y2="57" />
    <line x1="76" y1="64" x2="63" y2="57" />
    <line x1="130" y1="78" x2="145" y2="74" />
    <line x1="70" y1="78" x2="55" y2="74" />
  </g>

  <!-- Golden Rising Sun -->
  <circle cx="100" cy="68" r="18" fill="url(#richGold)" opacity="0.85" />

  <!-- Table Mountain Iconic Silhouette (Flattop plateau with Devil's Peak & Lion's Head) -->
  <path d="M42 98 L56 94 L68 91 L73 84 L127 84 L132 91 L144 94 L158 98 L158 106 L42 106 Z" fill="#0C0A07" stroke="url(#goldSheen)" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Table Mountain Horizontal Strata Facet Lines -->
  <line x1="73" y1="84" x2="127" y2="84" stroke="#FFF2A3" stroke-width="1.5" opacity="0.9" />
  <line x1="68" y1="91" x2="132" y2="91" stroke="#F2C054" stroke-width="0.8" opacity="0.5" />

  <!-- Regal African Safari Lion (Centerpiece Crest Motif) -->
  <!-- Majestic sculpted Lion Profile & Mane in 24k Gold -->
  <g id="lion-crest" fill="url(#richGold)" stroke="#231707" stroke-width="0.4">
    <!-- Mane Tufts -->
    <path d="M82 118 C80 110, 84 103, 90 98 C93 103, 93 108, 91 113 Z" />
    <path d="M118 118 C120 110, 116 103, 110 98 C107 103, 107 108, 109 113 Z" />
    <path d="M88 126 C83 120, 85 112, 91 108 C93 113, 92 119, 89 124 Z" />
    <path d="M112 126 C117 120, 115 112, 109 108 C107 113, 108 119, 111 124 Z" />
    
    <!-- Lion Face Symmetry -->
    <!-- Forehead & Crown -->
    <path d="M93 103 L100 97 L107 103 L105 110 L95 110 Z" />
    <!-- Cheeks & Snout -->
    <path d="M95 110 L92 116 L97 123 L100 120 L103 123 L108 116 L105 110 Z" />
    <!-- Nose & Whiskers pad -->
    <polygon points="98,118 102,118 100,121" fill="#1A1208" />
    <!-- Chin -->
    <path d="M97 124 L100 127 L103 124 Z" />
    <!-- Eyes -->
    <polygon points="95,110 98,111 96,112" fill="#0C0A07" />
    <polygon points="105,110 102,111 104,112" fill="#0C0A07" />
  </g>

  <!-- Luxury Monogram "L" Ribbon Banner Motif below lion -->
  <path d="M60 142 C72 137, 85 135, 100 135 C115 135, 128 137, 140 142 L136 150 C125 146, 113 144, 100 144 C87 144, 75 146, 64 150 Z" fill="url(#goldSheen)" />

  <!-- Five Five-Point Stars (representing 5-star premier hospitality) -->
  <g fill="url(#richGold)" transform="translate(0, 1)">
    <!-- Center Star -->
    <polygon points="100,152 101.5,156 106,156 102.5,158.5 104,163 100,160 96,163 97.5,158.5 94,156 98.5,156" />
    <!-- Left Star 1 -->
    <polygon points="88,154 89,157.5 93,157.5 90,159.5 91,163 88,161 85,163 86,159.5 83,157.5 87,157.5" transform="scale(0.85) translate(16, 26)" />
    <!-- Left Star 2 -->
    <polygon points="77,157 78,160 82,160 79.5,162 80.5,165 77,163.5 73.5,165 74.5,162 72,160 76,160" transform="scale(0.7) translate(34, 50)" />
    <!-- Right Star 1 -->
    <polygon points="112,154 113,157.5 117,157.5 114,159.5 115,163 112,161 109,163 110,159.5 107,157.5 111,157.5" transform="scale(0.85) translate(19, 26)" />
    <!-- Right Star 2 -->
    <polygon points="123,157 124,160 128,160 125.5,162 126.5,165 123,163.5 119.5,165 120.5,162 118,160 122,160" transform="scale(0.7) translate(51, 50)" />
  </g>
</svg>
